name: 🌀 Gesture Chaos Suite

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:
  chaos:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # Install Frontend Dependencies
      - name: 📦 Install Frontend Dependencies
        run: npm install

      # Run Chaos Suite — fails if robustness F1 drops below the 0.95 gate
      - name: 🌪️ Run Gesture Chaos Suite
        run: npm run test:chaos

      # Success Message
      - name: ✅ Chaos Suite Passed
        run: echo "Gesture classifier survived the chaos suite (F1 >= 0.95)."
